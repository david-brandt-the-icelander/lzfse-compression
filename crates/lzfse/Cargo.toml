[package]
name = "lzfse-zazzcat"
description = "LZFSE and LZVN compression (Apple's formats), written from scratch in Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["lzfse", "lzvn", "compression", "apple", "decmpfs"]
categories = ["compression", "no-std"]

[features]
default = ["std"]
# Block-parallel chunk compression on a persistent thread pool, and `std::error::Error`.
std = ["dep:rayon"]

[dependencies]
# Persistent work-stealing thread pool with safe borrowing of the caller's data; std's scoped threads would spawn
# fresh threads (and allocate) on every call.
rayon = { version = "1", optional = true }

[dev-dependencies]
proptest = "1"

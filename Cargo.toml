[workspace]
members = ["crates/lzfse", "crates/lzfse-cli", "crates/lzfse-bench"]
resolver = "2"
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MPL-2.0"
repository = "https://github.com/david-brandt-the-icelander/lzfse-compression"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
lto = "fat"
codegen-units = 1

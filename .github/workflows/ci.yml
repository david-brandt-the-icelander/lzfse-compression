# Lint, test and cross-check lzfse-zazzcat on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: no_std build
        run: cargo build -p lzfse-zazzcat --no-default-features
      - run: shellcheck scripts/*.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # On macOS this includes tests/apple.rs: libcompression both ways, ratio, system files and kernel reads.
      - run: cargo test --workspace --release -- --nocapture

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.80
      - run: cargo build -p lzfse-zazzcat

  reference:
    # Apple's BSD reference implementation, built from source, as a second independent codec.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the reference implementation
        run: |
          git clone --depth 1 https://github.com/lzfse/lzfse.git "$RUNNER_TEMP/lzfse"
          make -C "$RUNNER_TEMP/lzfse"
      - run: cargo build --release -p lzfse-cli
      - run: scripts/compat-reference.sh "$RUNNER_TEMP/lzfse/build/bin/lzfse" target/release/lzfse-zazzcat

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz each target briefly
        working-directory: fuzz
        run: |
          for t in decode round_trip lzvn_decode decmpfs; do
            cargo +nightly fuzz run "$t" -- -max_total_time=60
          done

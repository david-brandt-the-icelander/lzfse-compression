# Lint, test and cross-check lzfse-zazzcat on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make format-check
      # Warnings are errors, with both compilers, with and without threads.
      - run: make CC=gcc BUILD=build/gcc all
      - run: make CC=clang BUILD=build/clang all
      - run: make CC=clang BUILD=build/no-threads DEFINES=-DLZFSE_ZAZZCAT_NO_THREADS all
      - run: shellcheck scripts/*.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # On macOS this includes the Apple tests: libcompression both ways, ratio, system files and kernel reads.
      - run: make test
      - run: make test-alloc
      - name: Tests under AddressSanitizer and UndefinedBehaviorSanitizer
        run: make test-sanitize CC=${{ matrix.os == 'ubuntu-24.04' && 'gcc' || 'clang' }}

  reference:
    # Apple's BSD reference implementation, built from source, as a second independent codec.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the reference implementation
        run: |
          git clone --depth 1 https://github.com/lzfse/lzfse.git "$RUNNER_TEMP/lzfse"
          make -C "$RUNNER_TEMP/lzfse"
      - run: make build/lzfse-zazzcat
      - run: scripts/compat-reference.sh "$RUNNER_TEMP/lzfse/build/bin/lzfse" build/lzfse-zazzcat

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install libFuzzer
        run: sudo apt-get update && sudo apt-get install -y libclang-rt-18-dev
      - name: Fuzz each target for a minute
        run: make fuzz FUZZ_SECONDS=60

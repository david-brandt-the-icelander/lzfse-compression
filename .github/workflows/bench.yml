# Benchmark against Apple's libcompression on an Apple Silicon runner and publish the report in the job summary.
# Shared CI runners are noisy: use these numbers to spot regressions; the owner's Mac gives the authoritative ones.
name: Bench

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run
        run: |
          make CPU_FLAGS=-mcpu=apple-m1 build/lzfse-bench
          build/lzfse-bench --runs 11 > report.md
          cat report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: report.md
